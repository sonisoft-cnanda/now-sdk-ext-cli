name: Add to project

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2.0.1
        with:
          project-url: https://github.com/users/sonisoft-cnanda/projects/1
          github-token: ${{ secrets.PROJECT_TOKEN }}
